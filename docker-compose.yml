services:
  wedding-catcher:
    build: .
    ports:
      - "4000:4000"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - CONFIG_PATH=/app/data/config.yaml
    volumes:
      - ./data:/app/data
      - ./screenshots:/app/screenshots
    restart: unless-stopped
