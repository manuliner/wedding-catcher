<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Trautermin</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; max-width: 400px; margin: 4rem auto; padding: 1rem; }
        h1 { font-size: 1.25rem; margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.25rem; font-weight: 500; }
        input[type="password"] { width: 100%; padding: 0.5rem; margin-bottom: 1rem; }
        button { padding: 0.5rem 1rem; background: #333; color: white; border: none; cursor: pointer; }
        .error { color: #c00; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <h1>Trautermin – Login</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
        <label for="password">Passwort</label>
        <input type="password" id="password" name="password" required autofocus>
        <button type="submit">Anmelden</button>
    </form>
</body>
</html>
